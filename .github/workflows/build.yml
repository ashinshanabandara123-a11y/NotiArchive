
name: Build NotiArchive APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking repository contents..."
          ls -la

          find_settings() {
            find "$1" \
              -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -not -path '*/.git/*' \
              -not -path '*/.gradle/*' \
              -print -quit
          }

          SETTINGS="$(find_settings "$GITHUB_WORKSPACE" || true)"

          if [ -z "$SETTINGS" ]; then
            echo "No Gradle settings file found. Checking ZIP archives..."

            ARCHIVE=""

            while IFS= read -r file; do
              if unzip -Z1 "$file" 2>/dev/null |
                 grep -Eq '(^|/)settings\.gradle(\.kts)?$'; then
                ARCHIVE="$file"
                break
              fi
            done < <(
              find "$GITHUB_WORKSPACE" \
                -type f -iname '*.zip' \
                ! -iname '*log*'
            )

            if [ -z "$ARCHIVE" ]; then
              echo "::error::No Android Gradle project or project ZIP found."
              exit 1
            fi

            echo "Extracting: $ARCHIVE"
            mkdir -p "$GITHUB_WORKSPACE/.project-extracted"
            unzip -q "$ARCHIVE" \
              -d "$GITHUB_WORKSPACE/.project-extracted"

            SETTINGS="$(find_settings \
              "$GITHUB_WORKSPACE/.project-extracted" || true)"
          fi

          if [ -z "$SETTINGS" ]; then
            echo "::error::Gradle settings file still missing after extraction."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] &&
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "::error::Android app module not found in $PROJECT_DIR"
            exit 1
          fi

          echo "Gradle root: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build NotiArchive APK
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail
          gradle -p "$PROJECT_DIR" \
            assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Collect APK
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail

          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f -name '*.apk' -print -quit)"

          if [ -z "$APK" ]; then
            echo "::error::APK output not found."
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/NotiArchive-debug.apk"
          ls -lh "$GITHUB_WORKSPACE/NotiArchive-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NotiArchive-debug-APK
          path: NotiArchive-debug.apk
          if-no-files-found: error
          retention-days: 14
